# Конфигурация прогона HIL для F411CE (SESSION_CONFIG в cmake/blackpill.cmake).
# Пути — относительно этого файла.
[config]
target = "target.toml"
api = "../api.toml"

# Файлы данных проекта: t.profile.data["board"].
[data]
board = "board.toml"

# Preserve immutable evidence for each DDTT attempt.
[results]
capture = true

# Проектное подмножество регистров, путь от сессии.
[mmio]
svd = "../common/stm32f4-test.svd"
