# ST-Link через OpenOCD (0.11+; например, scoop install openocd), Windows.
# Скопировать в hil/F411CE/stands/local.toml или F401CC/stands/local.toml (не коммитится) и заменить значения.
[probe]
backend = "openocd"
serial = "REPLACE_WITH_STLINK_SERIAL"
executable = "openocd"              # из PATH или полный путь к openocd.exe
speed_khz = 1000
flash = "if-different"
